# ─────────────────────────────────────────────────────────────────────────
# nginx config para el site flowbit-studio (SPA Vite + React Router)
#
# Lo crítico: el `try_files ... /index.html` al final permite que rutas
# profundas como /propuestas/tacos-el-paisa funcionen cuando el usuario
# llega directo (F5 o link externo). Sin esto, nginx devolvería 404
# porque no existe un archivo en esa ruta — React Router la maneja
# client-side desde index.html.
# ─────────────────────────────────────────────────────────────────────────

server {
  listen       80;
  listen       [::]:80;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # Compresión gzip para assets text-based
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Cache agresivo para assets hasheados de Vite (tienen hash en el nombre,
  # así que cache-forever es seguro — cuando cambian, el nombre cambia)
  location ~* \.(js|css|woff|woff2|ttf|eot|otf|png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html NO se cachea — siempre debe ser fresh para recoger builds nuevos
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  # SPA fallback: cualquier ruta que no matchee un archivo estático sirve
  # index.html para que React Router la maneje
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Security headers básicos
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Oculta la versión de nginx en responses
  server_tokens off;
}
